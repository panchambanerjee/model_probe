[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "model-probe"
version = "0.1.0"
description = "Adversarial safety testing of LLMs"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "openai>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
